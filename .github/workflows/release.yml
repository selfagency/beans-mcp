name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-tag:
    name: Detect release tag and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read

    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
      ready: ${{ steps.tag.outputs.ready }}

    steps:
      - name: Resolve tag and verify CI readiness
        id: tag
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let tagName;

            if (context.eventName === 'workflow_dispatch') {
              const versionInput = '${{ inputs.version }}'.trim();
              if (!versionInput) {
                core.setFailed('version input is required for workflow_dispatch.');
                return;
              }
              tagName = versionInput.startsWith('v') ? versionInput : `v${versionInput}`;

              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const mainSha = main.data.commit.sha;

              core.info(`Creating tag ${tagName} at ${mainSha}...`);
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tagName}`,
                sha: mainSha,
              });
              core.info(`Tag ${tagName} created.`);
            } else {
              tagName = context.ref.replace('refs/tags/', '');
            }

            if (!tagName || !tagName.startsWith('v')) {
              core.info(`Ref '${context.ref}' is not a release tag; skipping.`);
              core.setOutput('release_tag', '');
              core.setOutput('release_sha', '');
              core.setOutput('ready', 'false');
              return;
            }

            const refData = await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` });
            const refObj = refData.data.object;
            const taggedSha =
              refObj.type === 'tag'
                ? (await github.rest.git.getTag({ owner, repo, tag_sha: refObj.sha })).data.object.sha
                : refObj.sha;

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;

            if (taggedSha !== mainSha) {
              core.setFailed(
                `Release blocked: tag ${tagName} points to ${taggedSha}, but latest main is ${mainSha}.`
              );
              return;
            }

            const requiredWorkflows = ['Test & Build'];
            for (const workflowName of requiredWorkflows) {
              const workflowsResp = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
              const workflow = workflowsResp.data.workflows.find(w => w.name === workflowName);
              if (!workflow) {
                core.setFailed(`Release blocked: required workflow '${workflowName}' not found in repository.`);
                return;
              }

              const runsResp = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.id,
                branch: 'main',
                head_sha: mainSha,
                status: 'completed',
                per_page: 10,
              });

              const run = runsResp.data.workflow_runs[0];
              if (!run) {
                core.setFailed(
                  `Release blocked: required workflow '${workflowName}' has no completed run for ${mainSha}.`
                );
                return;
              }

              if (run.conclusion !== 'success') {
                core.setFailed(
                  `Release blocked: workflow '${workflowName}' concluded with '${run.conclusion}' on ${mainSha}.`
                );
                return;
              }
            }

            core.info(`Release tag detected: ${tagName} on latest main commit ${mainSha}; all checks passed.`);
            core.setOutput('release_tag', tagName);
            core.setOutput('release_sha', taggedSha);
            core.setOutput('ready', 'true');

  build-and-prepare:
    name: Build + Validate + Generate Notes
    needs: detect-tag
    if: needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-tag.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate registry metadata
        run: pnpm validate-registry-metadata

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: npm pack ./dist --pack-destination .

      - name: Build release notes
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          toTag: ${{ needs.detect-tag.outputs.release_tag }}
          failOnError: true

      - name: Write release notes to file
        run: printf '%s' "$RELEASE_NOTES" > release-notes.md
        env:
          RELEASE_NOTES: ${{ steps.build_changelog.outputs.changelog }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            *.tgz
            release-notes.md
          if-no-files-found: error

  publish-to-npm:
    name: Publish to npm
    needs: [ detect-tag, build-and-prepare ]
    if: needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-tag.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm (Trusted Publishers + provenance)
        run: |
          set -euo pipefail
          if [[ "${{ needs.detect-tag.outputs.release_tag }}" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          npm publish ./dist --access public --provenance --tag "$DIST_TAG"

  publish-to-mcp-registry:
    name: Publish to MCP Registry
    needs: [ detect-tag, publish-to-npm ]
    if: needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true' &&
      !contains(needs.detect-tag.outputs.release_tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-tag.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -f - mcp-publisher

      - name: Login to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish docs/public/server.json

  create-github-release-prerelease:
    name: Create GitHub Release (prerelease)
    needs: [ detect-tag, build-and-prepare, publish-to-npm ]
    if: needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true' &&
      contains(needs.detect-tag.outputs.release_tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-tag.outputs.release_tag }}
          body_path: release-notes.md
          files: "*.tgz"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-github-release-stable:
    name: Create GitHub Release (stable)
    needs: [ detect-tag, build-and-prepare, publish-to-npm, publish-to-mcp-registry ]
    if: needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true' &&
      !contains(needs.detect-tag.outputs.release_tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-tag.outputs.release_tag }}
          body_path: release-notes.md
          files: "*.tgz"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rollback-tag-on-failure:
    name: Rollback release tag on failure
    needs: [ detect-tag, publish-to-npm, publish-to-mcp-registry, create-github-release-stable ]
    if: always() && needs.detect-tag.outputs.release_tag != '' && needs.detect-tag.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Determine if rollback is needed
        id: check_failure
        run: |
          if [[ "${{ needs.publish-to-npm.result }}" == "success" ]] && \
             [[ "${{ needs.publish-to-mcp-registry.result }}" == "success" || "${{ needs.publish-to-mcp-registry.result }}" == "skipped" ]] && \
             [[ "${{ needs.create-github-release-stable.result }}" == "success" ]]; then
            echo "all_critical_jobs_passed=true" >> $GITHUB_OUTPUT
            echo "All critical post-publish jobs succeeded. No rollback needed."
          else
            echo "all_critical_jobs_passed=false" >> $GITHUB_OUTPUT
            echo "Critical post-publish job failed. Rollback will be triggered."
          fi

      - name: Delete release tag if rollback needed
        if: steps.check_failure.outputs.all_critical_jobs_passed != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = '${{ needs.detect-tag.outputs.release_tag }}';

            core.info(`Checking if release tag ${tagName} exists...`);
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
              });
              core.info(`Deleting release tag ${tagName} due to workflow failure...`);
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
              });
              core.info(`Successfully deleted release tag ${tagName}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release tag ${tagName} does not exist (404). Nothing to delete.`);
              } else {
                core.setFailed(`Failed to delete release tag ${tagName}: ${error.message}`);
                throw error;
              }
            }

      - name: Create GitHub issue for failed release
        if: steps.check_failure.outputs.all_critical_jobs_passed != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = '${{ needs.detect-tag.outputs.release_tag }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const title = `🚨 Release ${tagName} failed - tag deleted`;
            const body = `
            The release workflow for \`${tagName}\` failed and the release tag was automatically deleted.

            **Workflow Run:** ${runUrl}

            **Status:** Critical post-publish jobs failed. The release tag \`${tagName}\` has been removed to prevent blocking future releases.

            **Next Steps:**
            1. Investigate the failure in the workflow run
            2. Fix the issue
            3. Create a new release tag (do not reuse the deleted tag)
            4. Trigger the release workflow
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['release', 'bug', 'automated'],
            });

            core.info(`Created GitHub issue for failed release: ${title}`);
